[project]
name = "script-net-health"
version = "0.0.0"
description = "Diagnostico NetOps hexagonal no host Windows."
readme = "../README.md"
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".venv-win",
    "venv",
    "data",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "D",
    "S",
    "BLE",
    "FBT",
    "A",
    "COM",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
]
ignore = [
    "E501",
    "D203",
    "D213",
    "ANN204",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLW0108",
    "COM812",
    "ISC001",
    "D1",
    "BLE001",
    "S105",
]

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2
known-first-party = ["domain", "application", "infrastructure", "presentation", "snh_paths"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "E402", "S603", "S607", "S101"]
"run.py" = ["T201", "S101", "E402", "I001"]
"tests/**/*.py" = ["ARG", "S101", "S106", "S603", "S607"]
"src/presentation/cli/**/*.py" = ["T201"]
"src/infrastructure/adapters/command_runner.py" = ["S603", "S404", "S607"]
"src/infrastructure/adapters/http_probe.py" = ["S310"]
"src/infrastructure/adapters/throughput_probe.py" = ["S310"]
"src/infrastructure/adapters/probe_parsers.py" = ["S104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "unit: unit tests",
    "domain: domain layer",
    "application: application layer",
    "infrastructure: infrastructure layer",
    "presentation: presentation layer",
    "interface: presentation/CLI",
    "integration: integration tests",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["domain", "application", "infrastructure", "presentation"]
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["dotenv.*"]
ignore_missing_imports = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 100
exclude = [
    ".git",
    ".venv",
    ".venv-win",
    "build",
    "dist",
    "scripts",
    "tests",
    "venv",
]

[tool.bandit]
skips = ["B105", "B106", "B404", "B603", "B310"]
exclude_dirs = [".git", ".venv", ".venv-win", "tests", "venv"]

[tool.coverage.run]
branch = true
source = ["domain", "application", "infrastructure", "presentation"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
    "raise ImportError",
    "\\.\\.\\.",
]

[tool.vulture]
exclude = []
ignore_decorators = []
ignore_names = []
min_confidence = 70
paths = ["src", "run.py", "scripts", "snh_paths.py"]
